function renderAdmOrdersList() {
  const c = document.getElementById('admOrdersList');
  const list = APP.data.allOrders || [];
  const f = admFilters.status, search = admFilters.search;
  const active = ['DITUGASKAN','DITERIMA DRIVER','MENUJU PICKUP','SAMPAI PICKUP','DIAMBIL','MENUJU TUJUAN'];
  const filtered = list.filter(o => {
    if (f !== 'ALL') {
      if (f === 'AKTIF' && !active.includes(o.status)) return false;
      if (f !== 'AKTIF' && o.status !== f) return false;
    }
    if (search) {
      const s = [o.order_code, o.customer?.name, o.customer?.phone].filter(Boolean).join(' ').toLowerCase();
      if (!s.includes(search)) return false;
    }
    return true;
  });
  if (!filtered.length) { c.innerHTML = '<div class="empty" style="padding:40px;"><span class="icon">📭</span>Tidak ada order</div>'; return; }
  c.innerHTML = filtered.map(o => renderAdmOrderCard(o)).join('');
}

async function admCancelOrder(orderId) {
  const ok = await showConfirm({ icon:'❌', title:'Batalkan Order?', message:'Order akan dibatalkan.', confirmText:'Ya', confirmColor:'red' });
  if (!ok) return;
  try {
    const order = (APP.data.allOrders || []).find(o => o.id === orderId);
    await APP.supabase.from('orders').update({ status:'DIBATALKAN', updated_at:new Date().toISOString() }).eq('id', orderId);
    await APP.supabase.from('order_status_history').insert({ order_id:orderId, status:'DIBATALKAN', changed_by:APP.user.id, note:'Dibatalkan admin' });
    if (order?.driver_id) await APP.supabase.from('drivers').update({ online_status:'ONLINE' }).eq('id', order.driver_id);
    showToast('✅ Order dibatalkan', 'success');
    closeGlobalModal();
    await loadAdmOrders();
    await loadAdmDashboard();
  } catch (err) { showToast('Gagal: ' + err.message, 'error'); }
}

async function loadAdmDrivers() {
  const c = document.getElementById('admDriversList');

  if (!data || !data.length) { c.innerHTML = '<div class="empty"><span class="icon">🛵</span>Belum ada driver</div>'; return; }
  const pids = data.map(d => d.profile_id);
  const { data: profs } = await APP.supabase.from('profiles').select('id, name, phone').in('id', pids);
  const pMap = {};
  (profs||[]).forEach(p => pMap[p.id] = p);
  admDrivers = data.map(d => ({ ...d, profile: pMap[d.profile_id] }));

  const today = new Date(); today.setHours(0,0,0,0);
  const { data: todayOrders } = await APP.supabase.from('orders').select('driver_id, status, driver_earnings').gte('created_at', today.toISOString()).not('driver_id','is',null);
  const orderCount = {}, earnings = {};
  (todayOrders||[]).forEach(o => {
    orderCount[o.driver_id] = (orderCount[o.driver_id] || 0) + 1;
    if (o.status === 'SELESAI') earnings[o.driver_id] = (earnings[o.driver_id] || 0) + Number(o.driver_earnings || 0);

async function admOpenAssign(orderId) {
  const order = (APP.data.allOrders || []).find(o => o.id === orderId);
  if (!order) return;
  const { data: drivers } = await APP.supabase.from('drivers').select('*').order('online_status').order('rating', { ascending:false });
  if (!drivers || !drivers.length) { showToast('Tidak ada driver', 'error'); return; }
  const pids = drivers.map(d => d.profile_id);
  const { data: profs } = await APP.supabase.from('profiles').select('id, name, phone').in('id', pids);
  const pMap = {};
  (profs||[]).forEach(p => pMap[p.id] = p);
  const list = drivers.map(d => ({ ...d, profile: pMap[d.profile_id] }));
  list.sort((a,b) => {
    const o = { ONLINE:0, BUSY:1, OFFLINE:2 };
    const diff = o[a.online_status] - o[b.online_status];
    return diff !== 0 ? diff : (b.rating||5) - (a.rating||5);

  openGlobalModal(`

      ${list.map(d => {
        const sc = d.online_status === 'ONLINE' ? 'var(--green)' : d.online_status === 'BUSY' ? 'var(--orange)' : '#94A3B8';
        return `
          <div class="driver-item" data-did="${d.id}" onclick="admSelectDriver('${d.id}')">
            <div class="avatar">${(d.profile?.name || 'D').charAt(0).toUpperCase()}</div>

async function admSaveDriver() {
  const name = document.getElementById('drvFormName').value.trim();
  const email = document.getElementById('drvFormEmail').value.trim();
  const password = document.getElementById('drvFormPassword').value;
  const phone = document.getElementById('drvFormPhone').value.trim();
  const driverCode = document.getElementById('drvFormCode').value.trim();
  const vehicle = document.getElementById('drvFormVehicle').value;
  const vehicleNum = document.getElementById('drvFormVehicleNum').value.trim();

  if (!name || !email || !password || !phone) { showToast('Field * wajib diisi', 'error'); return; }
  if (password.length < 6) { showToast('Password minimal 6 karakter', 'error'); return; }

  const btn = document.getElementById('btnAddDrv');
  btn.disabled = true; btn.innerHTML = '<span class="spinner-sm"></span>Membuat akun...';

  try {
    const { data: authData, error: authErr } = await APP.supabase.auth.signUp({
      email, password,
      options: { data: { name, phone: normalizePhone(phone), role: 'driver' } }
    });
    if (authErr) throw new Error('Auth: ' + authErr.message);
    if (!authData.user) throw new Error('Gagal buat user');

    const userId = authData.user.id;

    btn.innerHTML = '<span class="spinner-sm"></span>Menyimpan profil...';
    const { error: pErr } = await APP.supabase.from('profiles').insert([{
      id: userId, email, name, phone: normalizePhone(phone), role: 'driver', status: 'active'
    }]);
    if (pErr) throw new Error('Profile: ' + pErr.message);

    btn.innerHTML = '<span class="spinner-sm"></span>Menyimpan data driver...';
    const autoCode = driverCode || ('DRV-' + Date.now().toString().slice(-5));
    const { error: dErr } = await APP.supabase.from('drivers').insert([{
      profile_id: userId, driver_code: autoCode,
      vehicle_type: vehicle, vehicle_number: vehicleNum || '-',
      online_status: 'OFFLINE', rating: 5.00, total_orders: 0
    }]);
    if (dErr) throw new Error('Driver: ' + dErr.message);

    await APP.supabase.from('wallets').insert([{
      owner_id: userId, owner_role: 'driver', balance: 0, total_earned: 0
    }]).then(() => {}).catch(() => {});

    showToast('✅ Driver berhasil dibuat!', 'success');
    closeGlobalModal();

    const { data: { user: currentUser } } = await APP.supabase.auth.getUser();
    if (currentUser && currentUser.id !== userId) {
      await loadAdmDrivers();
    } else if (currentUser && currentUser.id === userId) {
      showToast('⚠️ Re-login admin diperlukan...', 'error');
      setTimeout(async () => {
        await APP.supabase.auth.signOut();
        window.location.reload();
      }, 2500);
    } else {
      await loadAdmDrivers();
    }

  } catch (err) {
    console.error(err);
    showToast('Gagal: ' + err.message, 'error');
    btn.disabled = false; btn.innerText = '💾 Simpan Driver';
  }
}

}

async function switchAdmTab(tab) {
  document.querySelectorAll('#app .nav-item').forEach(n => n.classList.toggle('active', n.dataset.tab === tab));
  document.querySelectorAll('#app .page').forEach(p => p.classList.remove('active'));
  document.getElementById('adm-page-' + tab)?.classList.add('active');
  window.scrollTo({ top:0, behavior:'smooth' });
  if (tab === 'dashboard') { await loadAdmDashboard(); await loadAdmWallet(); }
  if (tab === 'orders') await loadAdmOrders();
  if (tab === 'drivers') await loadAdmDrivers();
  if (tab === 'partners') await loadAdmPartners();
}

function subscribeAdmRealtime() {
  APP.realtimeChannel = APP.supabase.channel('admin-orders')
    .on('postgres_changes', { event:'*', schema:'public', table:'orders' },
      (payload) => {
        loadAdmDashboard();
        loadAdmOrders();
        loadAdmWallet();
        if (payload.eventType === 'INSERT') { showToast('🔔 Order baru', 'success'); playBeep(); }
        if (payload.eventType === 'UPDATE' && payload.new?.status === 'SELESAI') {
          showToast('✅ Order selesai: ' + payload.new.order_code, 'success');
        }
      }
    ).subscribe();
}

async function admLogout() {
  const ok = await showConfirm({ icon:'🚪', title:'Keluar?', message:'Anda akan keluar.', confirmText:'Ya', confirmColor:'red' });
  if (!ok) return;
  await APP.supabase.auth.signOut();
  window.location.reload();
}

window.addEventListener('online', () => showToast('🌐 Online', 'success'));
window.addEventListener('offline', () => showToast('📴 Offline', 'error'));

/* ================================================================
   START
   ================================================================ */
boot();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>

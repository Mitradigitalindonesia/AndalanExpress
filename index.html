<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
:root {
  --primary:#0B7CFF; --green:#16A34A; --orange:#F59E0B;
  --red:#EF4444; --purple:#8B5CF6; --bg:#F4F7FB;
  --text:#1E293B; --muted:#64748B; --border:#E2E8F0;
  --shadow: 0 2px 8px rgba(0,0,0,0.05);
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { overscroll-behavior-y:contain; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding-bottom:80px; -webkit-font-smoothing:antialiased; }

.btn { padding:12px 16px; border-radius:12px; border:none; font-weight:600; font-size:14px; cursor:pointer; font-family:inherit; transition:transform .1s, opacity .2s; width:100%; }
.btn:active:not(:disabled) { transform:scale(.97); }
.btn:disabled { opacity:.6; cursor:not-allowed; }
.btn-primary { background:var(--primary); color:white; }
.btn-green { background:var(--green); color:white; }
.btn-orange { background:var(--orange); color:white; }
.btn-red { background:var(--red); color:white; }
.btn-ghost { background:#F1F5F9; color:var(--text); }
.btn-outline { background:white; color:var(--primary); border:1.5px solid var(--primary); }
.btn-sm { padding:8px 12px; font-size:12px; }
.btn-row { display:flex; gap:8px; margin-top:10px; }
.btn-row .btn { flex:1; }

.card { background:white; border-radius:16px; padding:16px; box-shadow:var(--shadow); margin-bottom:12px; }
.card-clickable { cursor:pointer; transition:transform .15s; }
.card-clickable:active { transform:scale(.985); }

.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:flex-end; justify-content:center; z-index:200; backdrop-filter:blur(2px); }
.modal-overlay.active { display:flex; }
.modal-overlay.center { align-items:center; }
.modal { background:white; border-radius:24px 24px 0 0; padding:36px 20px 32px; width:100%; max-width:500px; max-height:92vh; overflow-y:auto; animation:slideUp .25s ease-out; position:relative; }
.modal::before { content:''; position:absolute; top:16px; left:50%; transform:translateX(-50%); width:40px; height:4px; background:#CBD5E1; border-radius:2px; }
.confirm-modal { background:white; border-radius:20px; padding:24px; width:90%; max-width:340px; text-align:center; animation:zoomIn .2s ease-out; }
@keyframes slideUp { from{transform:translateY(100%);} to{transform:translateY(0);} }
@keyframes zoomIn { from{transform:scale(.9);opacity:0;} to{transform:scale(1);opacity:1;} }
.modal h3 { font-size:18px; margin-bottom:16px; font-weight:700; }
.field { margin-bottom:14px; }
.field label { font-size:12px; color:var(--muted); display:block; margin-bottom:6px; font-weight:600; }
.field .req { color:var(--red); }
.field input, .field select, .field textarea { width:100%; padding:12px 14px; border:1.5px solid var(--border); border-radius:12px; font-size:14px; color:var(--text); background:white; font-family:inherit; transition:border-color .2s; }
.field input:focus, .field select:focus, .field textarea:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(11,124,255,.1); }
.field textarea { resize:vertical; min-height:60px; }

.toast { position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:#1E293B; color:white; padding:12px 20px; border-radius:30px; font-size:13px; display:none; z-index:3000; max-width:85%; text-align:center; box-shadow:0 4px 12px rgba(0,0,0,.2); font-weight:500; }
.toast.show { display:block; animation:fadeInUp .3s; }
.toast.success { background:var(--green); }
.toast.error { background:var(--red); }
@keyframes fadeInUp { from{opacity:0;transform:translate(-50%,20px);} to{opacity:1;transform:translate(-50%,0);} }

.badge { padding:4px 10px; border-radius:20px; font-size:10px; font-weight:700; color:white; text-transform:uppercase; letter-spacing:.3px; white-space:nowrap; display:inline-block; }
.header { background:var(--primary); color:white; padding:20px; border-radius:0 0 24px 24px; display:flex; justify-content:space-between; align-items:flex-start; position:sticky; top:0; z-index:50; }
.header h1 { font-size:13px; font-weight:500; opacity:.9; letter-spacing:.3px; }
.header .name { font-size:20px; font-weight:700; margin-top:2px; }
.header .sub { font-size:12px; opacity:.85; margin-top:2px; }

.bottom-nav { position:fixed; bottom:0; left:0; right:0; background:white; display:flex; justify-content:space-around; padding:8px 0 max(12px, env(safe-area-inset-bottom)); border-top:1px solid var(--border); z-index:100; box-shadow:0 -2px 8px rgba(0,0,0,.03); }
.nav-item { text-align:center; font-size:10px; color:#94A3B8; cursor:pointer; flex:1; padding:4px 0; transition:color .2s; user-select:none; }
.nav-item.active { color:var(--primary); font-weight:600; }
.nav-item .icon { font-size:20px; display:block; margin-bottom:2px; line-height:1; }

.empty { text-align:center; padding:30px 20px; color:var(--muted); font-size:13px; line-height:1.6; }
.empty .icon { font-size:48px; margin-bottom:12px; opacity:.6; display:block; }
.skeleton { background:linear-gradient(90deg,#E2E8F0 25%,#F1F5F9 50%,#E2E8F0 75%); background-size:200% 100%; animation:shimmer 1.5s infinite; border-radius:12px; height:100px; margin-bottom:12px; }
@keyframes shimmer { 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }

.boot-screen { position:fixed; inset:0; z-index:9999; background:linear-gradient(135deg,#0B7CFF,#4A9EFF); color:white; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.boot-screen.hidden { display:none; }
.boot-screen h1 { font-size:24px; font-weight:800; margin-bottom:4px; }
.boot-screen p { font-size:13px; opacity:.9; margin-bottom:24px; }
.spinner-lg { width:36px; height:36px; border:4px solid rgba(255,255,255,.3); border-top-color:white; border-radius:50%; animation:spin .8s linear infinite; }
.spinner-sm { display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,.4); border-top-color:white; border-radius:50%; animation:spin .6s linear infinite; margin-right:6px; vertical-align:middle; }
@keyframes spin { to{transform:rotate(360deg);} }

.services { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:16px; }
.service-card { background:white; border-radius:18px; padding:20px 16px; text-align:center; box-shadow:var(--shadow); cursor:pointer; border:none; font-family:inherit; transition:transform .15s; position:relative; overflow:hidden; }
.service-card:active { transform:scale(.97); }
.service-card::before { content:''; position:absolute; top:0; left:0; right:0; height:4px; }
.service-card.kurir::before { background:var(--primary); }
.service-card.jastip::before { background:var(--green); }
.service-card.kuliner::before { background:var(--orange); }
.service-card.ojek::before { background:var(--purple); }
.service-card .icon { font-size:36px; margin-bottom:8px; display:block; }
.service-card h3 { font-size:15px; font-weight:700; margin-bottom:4px; color:var(--text); }
.service-card p { font-size:11px; color:var(--muted); }

.guest-role-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
.guest-role-card { background:#F8FAFC; border:2px solid var(--border); border-radius:16px; padding:16px 8px; text-align:center; cursor:pointer; transition:all .2s; font-family:inherit; }
.guest-role-card:active { transform:scale(.96); }
.guest-role-card .icon { font-size:32px; margin-bottom:6px; display:block; }
.guest-role-card h3 { font-size:12px; font-weight:700; }
.guest-role-card p { font-size:10px; color:var(--muted); margin-top:2px; }

.driver-stats, .admin-stat-grid { display:grid; gap:10px; padding:16px; }
.driver-stats { grid-template-columns:1fr 1fr 1fr; }
.admin-stat-grid { grid-template-columns:1fr 1fr; }
.driver-stat, .admin-stat { background:white; border-radius:14px; padding:14px; text-align:center; box-shadow:var(--shadow); position:relative; overflow:hidden; }
.driver-stat .val, .admin-stat .val { font-size:20px; font-weight:800; color:var(--primary); line-height:1.2; }
.driver-stat .lbl, .admin-stat .lbl { font-size:10px; color:var(--muted); margin-top:2px; text-transform:uppercase; letter-spacing:.5px; font-weight:700; }
.admin-stat::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--primary); }
.admin-stat.green::before { background:var(--green); }
.admin-stat.orange::before { background:var(--orange); }
.admin-stat.purple::before { background:var(--purple); }

.online-toggle { display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.15); padding:8px 14px; border-radius:30px; font-size:12px; font-weight:700; cursor:pointer; border:none; color:white; font-family:inherit; }
.dot-status { width:8px; height:8px; border-radius:50%; background:#EF4444; flex-shrink:0; }
.dot-status.online { background:#22C55E; box-shadow:0 0 8px #22C55E; animation:pulse 2s infinite; }
.dot-status.busy { background:#F59E0B; }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.5;} }

.order-card { background:white; border-radius:16px; padding:16px; margin-bottom:12px; box-shadow:var(--shadow); border-left:4px solid var(--primary); animation:slideIn .3s ease-out; }
@keyframes slideIn { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
.order-card .row1 { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:8px; }
.order-card .code { font-weight:700; font-size:14px; }
.order-card .route { font-size:12px; color:var(--muted); line-height:1.6; margin-bottom:8px; }
.order-card .route strong { color:var(--text); }
.order-card .price { font-size:16px; font-weight:700; color:var(--green); }
.order-card .service { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.3px; }

.filter-chips { display:flex; gap:8px; padding:0 16px 12px; overflow-x:auto; scrollbar-width:none; }
.filter-chips::-webkit-scrollbar { display:none; }
.chip { padding:8px 14px; border-radius:20px; background:white; border:1px solid var(--border); font-size:12px; font-weight:700; color:var(--text); cursor:pointer; white-space:nowrap; transition:all .15s; flex-shrink:0; font-family:inherit; }
.chip.active { background:var(--primary); border-color:var(--primary); color:white; }
.chip .count { display:inline-block; background:rgba(0,0,0,.1); padding:1px 6px; border-radius:10px; font-size:10px; margin-left:4px; }
.chip.active .count { background:rgba(255,255,255,.25); }

.mitra-hero { background:linear-gradient(135deg,var(--accent,#16A34A),var(--accent-2,#22C55E)); color:white; margin:20px 16px 0; border-radius:22px; padding:22px; }
.mitra-hero .val { font-size:32px; font-weight:800; margin:8px 0; }
.mitra-hero .lbl { font-size:10.5px; opacity:.72; text-transform:uppercase; letter-spacing:.5px; font-weight:700; }
.mitra-hero-row { display:flex; gap:8px; margin-top:16px; padding-top:16px; border-top:1px solid rgba(255,255,255,.15); }
.mitra-hero-stat { flex:1; background:rgba(255,255,255,.12); border-radius:12px; padding:11px; }
.mitra-hero-stat .lbl { font-size:9.5px; opacity:.7; text-transform:uppercase; }
.mitra-hero-stat .val { font-size:17px; font-weight:800; margin-top:3px; }

.menu-item-card { background:white; border-radius:14px; padding:12px; margin-bottom:10px; box-shadow:var(--shadow); display:flex; gap:12px; align-items:center; }
.menu-item-card .menu-img { width:64px; height:64px; border-radius:14px; background:#F1F5F9; display:flex; align-items:center; justify-content:center; font-size:28px; flex-shrink:0; overflow:hidden; }
.menu-item-card .menu-img img { width:100%; height:100%; object-fit:cover; }
.menu-item-card .menu-info { flex:1; min-width:0; }
.menu-item-card .cat { font-size:10px; color:var(--primary); font-weight:800; text-transform:uppercase; }
.menu-item-card .name { font-weight:700; font-size:14px; margin:2px 0; }
.menu-item-card .price { font-weight:800; color:var(--green); font-size:14px; }
.menu-item-card .actions { display:flex; flex-direction:column; gap:6px; }
.icon-btn { width:36px; height:36px; border-radius:10px; border:none; background:#F1F5F9; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:16px; }
.icon-btn:active { transform:scale(.9); }

.quick-loc { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
.quick-loc button { padding:6px 12px; border-radius:20px; background:#EFF6FF; color:var(--primary); border:1px solid #BFDBFE; font-size:11px; font-weight:600; cursor:pointer; font-family:inherit; }

.price-estimate { background:linear-gradient(135deg,#EFF6FF,#DBEAFE); border:1.5px solid #BFDBFE; border-radius:14px; padding:14px; margin:12px 0; }
.price-estimate .label { font-size:11px; color:#1E40AF; font-weight:600; text-transform:uppercase; }
.price-estimate .price { font-size:22px; font-weight:800; color:var(--primary); margin:4px 0; }
.price-estimate .detail { font-size:11px; color:#1E40AF; line-height:1.6; }

.search-bar { padding:0 16px 12px; }
.search-bar input { width:100%; padding:12px 14px; border:1.5px solid var(--border); border-radius:12px; font-size:14px; font-family:inherit; }

.container { width:100%; max-width:500px; margin:0 auto; }
.page { display:none; }
.page.active { display:block; }
.hidden { display:none !important; }
.section { padding:0 16px; margin-top:8px; }
.section h2 { font-size:15px; font-weight:700; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; }
.powered { text-align:center; padding:24px 16px; font-size:11px; color:var(--muted); }

.wallet-hero { background:linear-gradient(135deg,var(--primary),#4A9EFF); color:white; margin:16px; border-radius:20px; padding:22px; box-shadow:0 8px 24px rgba(11,124,255,.3); }
.wallet-hero.green { background:linear-gradient(135deg,#16A34A,#22C55E); box-shadow:0 8px 24px rgba(22,163,74,.3); }
.wallet-hero .lbl { font-size:11px; opacity:.85; text-transform:uppercase; letter-spacing:.5px; font-weight:700; }
.wallet-hero .val { font-size:32px; font-weight:800; margin:8px 0; }
.wallet-hero .meta { display:flex; gap:12px; font-size:11px; opacity:.9; flex-wrap:wrap; }
.chart-card { background:white; border-radius:16px; padding:14px; box-shadow:var(--shadow); }
.chart-stats { display:flex; justify-content:space-between; margin-top:12px; padding-top:12px; border-top:1px dashed var(--border); font-size:12px; }
.chart-stats .item { text-align:center; flex:1; }
.chart-stats .item:not(:first-child) { border-left:1px solid var(--border); }
.chart-stats .lbl { color:var(--muted); font-size:10px; text-transform:uppercase; font-weight:700; }
.chart-stats .val { font-weight:800; margin-top:2px; }

.driver-item { display:flex; align-items:center; gap:12px; padding:12px; border-radius:12px; margin-bottom:6px; border:1.5px solid var(--border); background:white; cursor:pointer; }
.driver-item.selected { border-color:var(--primary); background:#EFF6FF; }
.driver-item .avatar { width:40px; height:40px; border-radius:50%; background:var(--primary); color:white; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:16px; flex-shrink:0; }
.driver-item .info { flex:1; min-width:0; }
.driver-item .info .name { font-weight:700; font-size:13px; }
.driver-item .info .meta { font-size:11px; color:var(--muted); }

.wa-composer { background:#F0FDF4; border:1.5px solid #BBF7D0; border-radius:14px; padding:14px; margin-bottom:14px; }
.wa-composer textarea { width:100%; padding:12px; border:1.5px solid #BBF7D0; border-radius:10px; font-size:13px; font-family:inherit; min-height:100px; resize:vertical; }

.featured-menu-scroll {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 0 16px 16px;
  margin: 0 -16px;
}
.featured-menu-scroll::-webkit-scrollbar { display: none; }
.featured-menu-item {
  flex-shrink: 0;
  width: 160px;
  background: white;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform .15s;
}
.featured-menu-item:active { transform: scale(.97); }
.featured-menu-item .fm-img {
  width: 100%;
  height: 100px;
  background: linear-gradient(135deg,#FEF3C7,#FDE68A);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 42px;
  overflow: hidden;
}
.featured-menu-item .fm-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.featured-menu-item .fm-body {
  padding: 10px 12px;
}
.featured-menu-item .fm-partner {
  font-size: 9.5px;
  color: var(--primary);
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.featured-menu-item .fm-name {
  font-weight: 700;
  font-size: 12.5px;
  margin: 3px 0 6px;
  line-height: 1.3;
  min-height: 32px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.featured-menu-item .fm-price {
  font-weight: 800;
  color: var(--green);
  font-size: 13px;
}

.help-fab {
  position: fixed;
  bottom: 92px;
  right: 16px;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: linear-gradient(135deg, #0B7CFF, #4A9EFF);
  color: white;
  border: none;
  font-size: 22px;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(11,124,255,.4);
  z-index: 90;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform .2s, box-shadow .2s;
  animation: helpPulse 3s ease-in-out infinite;
  text-decoration: none;
}
.help-fab:active { transform: scale(.9); }
.help-fab:hover { box-shadow: 0 6px 20px rgba(11,124,255,.55); }

@keyframes helpPulse {
  0%,100% { box-shadow: 0 4px 16px rgba(11,124,255,.4); }
  50% { box-shadow: 0 4px 24px rgba(11,124,255,.65); }
}

body[data-role="mitra"] .help-fab {
  background: linear-gradient(135deg, #16A34A, #22C55E);
  box-shadow: 0 4px 16px rgba(22,163,74,.4);
}

  background: linear-gradient(135deg, #8B5CF6, #A78BFA);
  box-shadow: 0 4px 16px rgba(139,92,246,.4);
}
body[data-role="guest"] .help-fab,
body[data-role="loading"] .help-fab {
  display: none;
}
</style>

function formatRupiahShort(v) {
  v = Number(v) || 0;
  if (v >= 1e9) return 'Rp ' + (v/1e9).toFixed(1) + 'M';
  if (v >= 1e6) return 'Rp ' + (v/1e6).toFixed(1) + 'jt';
  if (v >= 1e3) return 'Rp ' + Math.round(v/1e3) + 'rb';
  return 'Rp ' + Math.round(v);
}

async function getWalletStats(ownerId, days = 7) {
  const wallet = await getWallet(ownerId);
  if (!wallet) return { wallet: null, daily: [], avg: 0, total: 0 };
  
  const since = new Date(); 
  since.setDate(since.getDate() - (days-1)); 
  since.setHours(0,0,0,0);
  
  const { data: txs } = await APP.supabase
    .from('wallet_transactions')
    .select('amount, type, created_at')
    .eq('wallet_id', wallet.id)
    .eq('type', 'earning')
    .gte('created_at', since.toISOString());
  
  const dailyMap = {};
  for (let i = 0; i < days; i++) {
    const d = new Date(); 
    d.setDate(d.getDate() - (days-1-i)); 
    d.setHours(0,0,0,0);
    const key = d.toISOString().slice(0,10);
    dailyMap[key] = 0;
  }
  (txs || []).forEach(t => {
    const key = (t.created_at || '').slice(0,10);
    if (dailyMap[key] !== undefined) dailyMap[key] += Number(t.amount) || 0;
  });
  
  const daily = Object.entries(dailyMap)
    .sort((a,b) => a[0].localeCompare(b[0]))
    .map(([day, amount]) => ({ day, amount }));
  const total = daily.reduce((s,d) => s + d.amount, 0);
  const avg = daily.length ? total / daily.length : 0;
  
  return { wallet, daily, avg, total };
}

async function loadConfigFromDB() {
  const DEFAULT = {
    maps_api_key: FALLBACK_MAPS_KEY,
    admin_phone: ADMIN_PHONE_FALLBACK,
    app_name: 'Andalan Express'
  };
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/app_config?is_public=eq.true`, {
      headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
    });
    if (!res.ok) return DEFAULT;
    const data = await res.json();
    if (!Array.isArray(data)) return DEFAULT;
    const config = { ...DEFAULT };
    data.forEach(r => { config[r.key] = r.value; });
    try { localStorage.setItem('app_config_cache', JSON.stringify({ data:config, ts:Date.now() })); } catch(e){}
    return config;
  } catch (err) {
    try {
      const cached = localStorage.getItem('app_config_cache');
      if (cached) {
        const { data, ts } = JSON.parse(cached);
        if (Date.now() - ts < 864e5) return data;
      }
    } catch(e){}
    return DEFAULT;
  }
}

function loadGoogleMaps(apiKey) {
  return new Promise((resolve, reject) => {
    if (window.google?.maps?.Geocoder) { resolve(); return; }
    const cb = '_gmap_ready_' + Date.now();
    window[cb] = () => { delete window[cb]; resolve(); };
    const script = document.createElement('script');
    script.src = `https://maps.googleapis.com/maps/api/js?key=${apiKey}&libraries=places&language=id&region=ID&callback=${cb}&loading=async`;
    script.async = true;
    script.defer = true;
    script.onerror = () => reject(new Error('Google Maps gagal load'));
    document.head.appendChild(script);
    setTimeout(() => reject(new Error('Maps timeout')), 10000);
  });
}

function formatDate(iso) {

  const d = new Date(iso), today = new Date();
  const diff = Math.floor((today - d) / 864e5);
  if (diff === 0) return 'Hari ini, ' + formatTime(iso);

function getRule(t) { return APP.pricing[t] || DEFAULT_PRICING[t] || DEFAULT_PRICING.kurir; }

function calculateCost({ serviceType, distanceKm, subtotal = 0 }) {
  const rule = getRule(serviceType);
  const distance = Math.max(0, Number(distanceKm) || 0);
  const serviceCost = Math.round(distance * rule.price_per_km);
  const serviceFee = rule.service_fee;
  const umkmMarkup = Math.round(subtotal * (rule.umkm_markup_pct / 100));
  const subtotalWithMarkup = subtotal + umkmMarkup;
  const totalPrice = subtotalWithMarkup + serviceCost + serviceFee;
  const driverEarnings = Math.round(serviceCost * (1 - rule.driver_fee_pct / 100));
  const platformFromDriver = serviceCost - driverEarnings;
  const platformEarnings = platformFromDriver + serviceFee + umkmMarkup;
  const mitraEarnings = subtotalWithMarkup;
  return { subtotal:subtotalWithMarkup, service_cost:serviceCost, service_fee:serviceFee,
    total_price:totalPrice, distance_km:distance, umkm_markup:umkmMarkup,
    driver_earnings:driverEarnings, mitra_earnings:mitraEarnings, platform_earnings:platformEarnings };
}

function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880; osc.type = 'sine';
    gain.gain.setValueAtTime(.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.01, ctx.currentTime + .5);
    osc.start(); osc.stop(ctx.currentTime + .5);
  } catch(e){}
}

function geocodeAddress(address) {
  return new Promise((resolve, reject) => {
    if (!APP.geocoder) { reject(new Error('Maps belum siap')); return; }
    APP.geocoder.geocode({ address, region:'ID' }, (results, status) => {
      if (status === 'OK' && results[0]) {
        const loc = results[0].geometry.location;
        resolve({ lat:loc.lat(), lng:loc.lng(), formatted:results[0].formatted_address });
      } else reject(new Error('Alamat tidak ditemukan'));
    });
  });
}

function getDistanceMatrix(origin, destination) {
  return new Promise((resolve, reject) => {
    if (!APP.distanceService) { reject(new Error('Distance service belum siap')); return; }
    const cacheKey = `${origin}|${destination}`.toLowerCase();
    const cache = APP.data.__distanceCache || (APP.data.__distanceCache = {});
    if (cache[cacheKey]) { resolve(cache[cacheKey]); return; }
    APP.distanceService.getDistanceMatrix({
      origins:[origin], destinations:[destination],
      travelMode: google.maps.TravelMode.DRIVING,
      unitSystem: google.maps.UnitSystem.METRIC, language:'id'
    }, (response, status) => {
      if (status !== 'OK') { reject(new Error('Maps: ' + status)); return; }
      const el = response.rows?.[0]?.elements?.[0];
      if (!el || el.status !== 'OK') { reject(new Error('Rute tidak ditemukan')); return; }
      const result = {
        distance_km: Math.round((el.distance.value / 1000) * 10) / 10,
        duration_min: Math.round(el.duration.value / 60)
      };
      cache[cacheKey] = result;
      resolve(result);
    });
  });
}

async function getOSRMDistance(origin, destination) {
  let o, d;
  try {
    o = typeof origin === 'string' ? await geocodeAddress(origin) : origin;
    d = typeof destination === 'string' ? await geocodeAddress(destination) : destination;
  } catch(e) { throw new Error('Geocode gagal: ' + e.message); }
  const url = `https://router.project-osrm.org/route/v1/driving/${o.lng},${o.lat};${d.lng},${d.lat}?overview=false`;
  const res = await fetch(url);
  const data = await res.json();
  if (data.code !== 'Ok' || !data.routes?.[0]) throw new Error('OSRM gagal');
  const route = data.routes[0];
  return { distance_km: Math.round((route.distance/1000)*10)/10, duration_min: Math.round(route.duration/60) };
}

async function getDistance(origin, destination) {
  try {
    if (APP.mapsReady) return await getDistanceMatrix(origin, destination);
    throw new Error('Maps not ready');
  } catch (err) {
    console.warn('Google Maps gagal, coba OSRM:', err.message);
    return await getOSRMDistance(origin, destination);
  }
}

let autocompletes = {};
function setupAutocomplete(fieldId, onPlaceSelected) {
  if (!APP.mapsReady) { setTimeout(() => setupAutocomplete(fieldId, onPlaceSelected), 500); return; }
  const input = document.getElementById(fieldId);
  if (!input) return;
  if (autocompletes[fieldId]) {
    google.maps.event.clearInstanceListeners(autocompletes[fieldId]);
    autocompletes[fieldId] = null;
  }
  const auto = new google.maps.places.Autocomplete(input, {
    types:['geocode','establishment'], componentRestrictions:{ country:'id' },
    fields:['formatted_address','geometry','name','place_id']
  });
  auto.addListener('place_changed', () => {
    const place = auto.getPlace();
    if (place.geometry) {
      input.dataset.lat = place.geometry.location.lat();
      input.dataset.lng = place.geometry.location.lng();
      input.value = place.formatted_address || place.name || input.value;
      if (onPlaceSelected) onPlaceSelected();
    }
  });
  input.addEventListener('blur', () => { setTimeout(() => { if (onPlaceSelected) onPlaceSelected(); }, 300); });
  autocompletes[fieldId] = auto;
}

function useCurrentLocation(fieldId, onDone) {
  if (!navigator.geolocation) { showToast('GPS tidak didukung', 'error'); return; }
  showToast('Mengambil lokasi...');
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const { latitude, longitude } = pos.coords;
      if (!APP.geocoder) { document.getElementById(fieldId).value = `${latitude.toFixed(5)}, ${longitude.toFixed(5)}`; if (onDone) onDone(); return; }
      APP.geocoder.geocode({ location:{ lat:latitude, lng:longitude } }, (results, status) => {
        const input = document.getElementById(fieldId);
        if (status === 'OK' && results[0]) {
          input.value = results[0].formatted_address;
          input.dataset.lat = latitude;
          input.dataset.lng = longitude;
        } else input.value = `${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;
        showToast('✅ Lokasi terisi', 'success');
        if (onDone) onDone();
      });
    },
    (err) => showToast('Gagal: ' + err.message, 'error'),
    { enableHighAccuracy:true, timeout:10000 }
  );
}

async function doLogin(expectedRole) {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const btn = document.getElementById('btnLogin');
  const errEl = document.getElementById('loginError');

  if (!email || !password) {
    errEl.style.display = 'block';
    errEl.innerText = 'Email dan password wajib diisi';
    return;
  }
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-sm"></span>Memproses...';

  try {
    const { data, error } = await APP.supabase.auth.signInWithPassword({ email, password });
    if (error) throw error;

    const { data: profile } = await APP.supabase
      .from('profiles').select('role, name').eq('id', data.user.id).maybeSingle();

    if (!profile) {
      await APP.supabase.auth.signOut();
      throw new Error('Profil tidak ditemukan. Hubungi admin.');
    }
    if (profile.role !== expectedRole) {
      await APP.supabase.auth.signOut();
      throw new Error(`Akun ini terdaftar sebagai ${profile.role.toUpperCase()}, bukan ${expectedRole.toUpperCase()}.`);
    }

    closeGlobalModal();
    showToast('✅ Login berhasil', 'success');
    APP.user = data.user;
    APP.profile = profile;
    APP.role = profile.role;
    setTimeout(() => renderByRole(profile.role), 500);
  } catch (err) {
    errEl.style.display = 'block';
    let msg = err.message;
    if (msg.includes('Invalid login')) msg = 'Email atau password salah.';
    else if (msg.includes('Email not confirmed')) msg = 'Email belum diverifikasi.';
    errEl.innerText = msg;
    btn.disabled = false;
    btn.innerText = `Masuk sebagai ${expectedRole.charAt(0).toUpperCase() + expectedRole.slice(1)}`;
  }
}

function getGuestData() {

}
function saveGuestData(data) {
  try { localStorage.setItem('andalan_guest', JSON.stringify(data)); } catch(e){}
}

function switchCustTab(tab) {
  document.querySelectorAll('#app .nav-item').forEach(n => n.classList.toggle('active', n.dataset.tab === tab));
  document.querySelectorAll('#app .page').forEach(p => p.classList.remove('active'));
  document.getElementById('cust-page-' + tab)?.classList.add('active');
  window.scrollTo({ top:0, behavior:'smooth' });
  
  if (tab === 'orders') {
    const g = getGuestData();
    const custId = g?.id || APP.user?.id;
    if (custId) loadCustOrders(custId);
  }
}

async function loadFeaturedMenus() {
  const c = document.getElementById('custFeaturedMenus');
  if (!c) return;

  try {
    const { data: partners } = await APP.supabase
      .from('partners').select('id, business_name, status')
      .eq('status', 'OPEN');

    if (!partners || !partners.length) {
      c.innerHTML = '<div class="empty" style="padding:20px;width:100%;"><span class="icon">🍽️</span>Belum ada mitra buka</div>';
      return;
    }

    const partnerIds = partners.map(p => p.id);
    const partnerMap = {};
    partners.forEach(p => partnerMap[p.id] = p);

    const { data: menus } = await APP.supabase
      .from('menus').select('*')
      .in('partner_id', partnerIds)
      .eq('is_available', true)
      .order('created_at', { ascending: false })
      .limit(10);

    if (!menus || !menus.length) {
      c.innerHTML = '<div class="empty" style="padding:20px;width:100%;"><span class="icon">📭</span>Belum ada menu tersedia</div>';
      return;
    }

    c.innerHTML = menus.map(m => {
      const partner = partnerMap[m.partner_id];
      const imgHtml = m.image_url 
        ? `<img src="${m.image_url}" alt="" onerror="this.parentElement.innerHTML='🍽️'">` 
        : '🍽️';
      return `
        <div class="featured-menu-item" onclick="openOrderForm('kuliner')">
          <div class="fm-img">${imgHtml}</div>
          <div class="fm-body">
            <div class="fm-partner">${escapeHtml(partner?.business_name || 'Mitra')}</div>
            <div class="fm-name">${escapeHtml(m.name)}</div>
            <div class="fm-price">Rp ${Number(m.price).toLocaleString('id-ID')}</div>
          </div>
        </div>
      `;
    }).join('');
  } catch (err) {
    console.error('Featured menus error:', err);
    c.innerHTML = '<div class="empty" style="padding:20px;width:100%;">Gagal memuat menu</div>';
  }
}

async function saveCustGuestData() {
  const name = document.getElementById('custGuestName').value.trim();
  const phone = document.getElementById('custGuestPhone').value.trim().replace(/\D/g, '');
  if (!name || name.length < 2) { showToast('Nama minimal 2 karakter', 'error'); return; }
  if (!phone || phone.length < 9) { showToast('Nomor HP tidak valid', 'error'); return; }
  const normalizedPhone = normalizePhone(phone);

  try {
    const { data: existing } = await APP.supabase
      .from('profiles')
      .select('id, name, phone')
      .eq('phone', normalizedPhone)
      .maybeSingle();

    let profileId, finalName;

    if (existing) {
      profileId = existing.id;
      finalName = name;
      if (existing.name !== name) {
        await APP.supabase.from('profiles').update({ name }).eq('id', existing.id);
      }
    } else {
      const { data: newProfile, error } = await APP.supabase
        .from('profiles')
        .insert({ 
          name, 
          phone: normalizedPhone, 
          email: `guest_${Date.now()}_${Math.random().toString(36).slice(2,8)}@andalan.local`, 
          role: 'customer', 
          status: 'active' 
        })
        .select()
        .single();

      if (error) {
        const { data: retry, error: retryErr } = await APP.supabase
          .from('profiles')
          .insert({ 
            id: crypto.randomUUID(),
            name, 
            phone: normalizedPhone, 
            email: `guest_${Date.now()}_${Math.random().toString(36).slice(2,8)}@andalan.local`, 
            role: 'customer', 
            status: 'active' 
          })
          .select()
          .single();

        if (retryErr) throw new Error(retryErr.message);
        profileId = retry.id;
      } else {
        profileId = newProfile.id;
      }
      finalName = name;
    }

    saveGuestData({ id: profileId, name: finalName, phone: normalizedPhone });
    closeGlobalModal();
    showToast('✅ Data tersimpan', 'success');
    await renderByRole('customer');

  } catch (err) {
    console.error('saveCustGuestData error:', err);
    showToast('Gagal: ' + err.message, 'error');
  }
}

async function loadCustOrders(customerId) {
  const { data } = await APP.supabase.from('orders').select('*')
    .eq('customer_id', customerId).order('created_at', { ascending:false }).limit(50);
  const all = data || [];
  renderCustOrderList('custAllOrders', all, 'Belum ada pesanan');
}

function renderCustOrderList(containerId, orders, emptyMsg) {
  const c = document.getElementById(containerId);
  if (!c) return;
  if (!orders.length) {
    c.innerHTML = `<div class="empty"><span class="icon">📭</span>${emptyMsg}</div>`;
    return;
  }
  c.innerHTML = orders.map(o => `
    <div class="card card-clickable" style="border-left:4px solid ${getStatusColor(o.status)};" onclick="openCustOrderDetail('${o.id}')">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
        <strong>${o.order_code}</strong>
        <span class="badge" style="background:${getStatusColor(o.status)};">${o.status}</span>
      </div>
      <div style="font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:8px;">
        ${getServiceIcon(o.service_type)} ${o.service_type?.toUpperCase()}
      </div>
      <div style="font-size:12px;color:var(--muted);line-height:1.5;">
        🎯 ${escapeHtml(o.destination_address || '-')}
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:10px;align-items:center;">
        <span class="price">Rp ${Number(o.total_price||0).toLocaleString('id-ID')}</span>
        <span style="font-size:11px;color:var(--muted);">${formatTime(o.created_at)}</span>
      </div>
    </div>
  `).join('');
}

function subscribeCustRealtime(customerId) {
  APP.realtimeChannel = APP.supabase.channel('customer-' + customerId)
    .on('postgres_changes', { event:'*', schema:'public', table:'orders', filter:`customer_id=eq.${customerId}` },
      () => {
        const g = getGuestData();
        const custId = g?.id || APP.user?.id;
        if (custId && document.getElementById('custAllOrders')) {
          loadCustOrders(custId);
        }
        showToast('📢 Update pesanan');
      }
    ).subscribe();
}

async function openCustOrderDetail(orderId) {
  const { data: order } = await APP.supabase.from('orders').select('*').eq('id', orderId).single();
  if (!order) return;
  const { data: history } = await APP.supabase.from('order_status_history').select('*')
    .eq('order_id', orderId).order('created_at');
  let items = [];
  if (order.service_type === 'kuliner') {
    const { data: oi } = await APP.supabase.from('order_items').select('*').eq('order_id', orderId);
    items = oi || [];
  }
  let driver = null;
  if (order.driver_id) {
    const { data: d } = await APP.supabase.from('drivers').select('*, profile:profile_id(name, phone)').eq('id', order.driver_id).maybeSingle();
    driver = d;
  }

  const tracking = getTrackingSteps(order.service_type);
  openGlobalModal(`
    <h3>${getServiceIcon(order.service_type)} ${order.order_code}</h3>
    <div class="field"><label>Status</label><div><span class="badge" style="background:${getStatusColor(order.status)};">${order.status}</span></div></div>
    ${driver ? `
      <div class="field">
        <label>Driver</label>
        <div style="display:flex;gap:12px;align-items:center;background:#EFF6FF;padding:12px;border-radius:12px;">
          <div style="width:44px;height:44px;border-radius:50%;background:var(--primary);color:white;display:flex;align-items:center;justify-content:center;font-weight:700;">
            ${(driver.profile?.name || 'D').charAt(0).toUpperCase()}
          </div>
          <div style="flex:1;">
            <div style="font-weight:700;">${escapeHtml(driver.profile?.name || 'Driver')}</div>
            <div style="font-size:11px;color:var(--muted);">${driver.vehicle_type || ''} · ${driver.vehicle_number || ''}</div>
          </div>
          ${driver.profile?.phone ? `<a href="https://wa.me/${normalizePhone(driver.profile.phone)}" target="_blank" style="width:40px;height:40px;background:var(--green);color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;">💬</a>` : ''}
        </div>
      </div>
    ` : ''}
    <div class="field"><label>Pickup</label><div>📍 ${escapeHtml(order.pickup_address || '-')}</div></div>
    <div class="field"><label>Tujuan</label><div>🎯 ${escapeHtml(order.destination_address || '-')}</div></div>
    ${items.length ? `
      <div class="field">
        <label>Item</label>
        <div style="background:#F8FAFC;padding:10px 12px;border-radius:10px;font-size:13px;">
          ${items.map(i => `• ${escapeHtml(i.item_name)} × ${i.quantity} = Rp ${Number(i.subtotal).toLocaleString('id-ID')}`).join('<br>')}
        </div>
      </div>` : ''}
    ${order.customer_note ? `<div class="field"><label>Catatan</label><div>${escapeHtml(order.customer_note)}</div></div>` : ''}
    <div class="field">
      <label>Rincian</label>
      <div style="background:#F8FAFC;padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.7;">
        ${order.subtotal > 0 ? `Subtotal: Rp ${Number(order.subtotal).toLocaleString('id-ID')}<br>` : ''}
        Jarak: ${Number(order.distance_km||0).toFixed(1)} km<br>
        Jasa: Rp ${Number(order.delivery_fee||0).toLocaleString('id-ID')}<br>
        Biaya layanan: Rp ${Number(order.service_fee||0).toLocaleString('id-ID')}<br>
        <strong style="color:var(--green);">Total: Rp ${Number(order.total_price).toLocaleString('id-ID')}</strong>
      </div>
    </div>
    <div class="field">
      <label>Progres</label>
      <div style="background:#F8FAFC;padding:12px;border-radius:12px;">
        ${tracking.map(step => {
          const done = history?.some(h => h.status === step.status) && step.status !== order.status;
          const active = step.status === order.status;
          const color = active ? 'var(--primary)' : done ? 'var(--green)' : '#CBD5E1';
          const weight = (active || done) ? '600' : '400';
          return `<div style="display:flex;gap:10px;align-items:center;margin-bottom:6px;font-size:12px;color:${color};font-weight:${weight};">
            <span style="width:10px;height:10px;border-radius:50%;background:${color};"></span>${step.label}
          </div>`;
        }).join('')}
      </div>
    </div>
    <div class="btn-row" style="margin-top:16px;">
      <button class="btn btn-ghost" onclick="closeGlobalModal()">Tutup</button>
      <button class="btn btn-primary" onclick="custWhatsAppAdmin('${order.order_code}')">💬 Bantuan</button>
    </div>
  `);
}

function getTrackingSteps(serviceType) {
  if (serviceType === 'kuliner') {
    return [
      { status:'MENUNGGU', label:'Order dibuat' },
      { status:'DIPROSES', label:'Diterima mitra' },
      { status:'SIAP DIAMBIL', label:'Siap diambil' },
      { status:'DITUGASKAN', label:'Driver ditugaskan' },
      { status:'MENUJU PICKUP', label:'Driver menuju lokasi' },
      { status:'DIAMBIL', label:'Pesanan diambil' },
      { status:'MENUJU TUJUAN', label:'Menuju lokasi Anda' },
      { status:'SELESAI', label:'Pesanan tiba' }
    ];
  }
  return [
    { status:'MENUNGGU', label:'Order dibuat' },
    { status:'DIPROSES', label:'Diproses admin' },
    { status:'DITUGASKAN', label:'Driver ditugaskan' },
    { status:'MENUJU PICKUP', label:'Driver menuju pickup' },
    { status:'DIAMBIL', label:'Barang/penumpang diambil' },
    { status:'MENUJU TUJUAN', label:'Menuju tujuan' },
    { status:'SELESAI', label:'Selesai' }
  ];
}

let estTimer = null;
function triggerEstimate(type) {
  clearTimeout(estTimer);
  estTimer = setTimeout(() => updateEstimate(type), 700);
}

async function updateEstimate(type) {
  if (type === 'kuliner') { updateKulinerTotal(); return; }
  const priceEl = document.getElementById('estPrice');
  const detailEl = document.getElementById('estDetail');
  if (!priceEl || !detailEl) return;

  let pickup, dest;
  if (type === 'jastip') {
    pickup = document.getElementById('fldStore')?.value?.trim();
    dest = document.getElementById('fldDest')?.value?.trim();
  } else {
    pickup = document.getElementById('fldPickup')?.value?.trim();
    dest = document.getElementById('fldDest')?.value?.trim();
  }

  if (!pickup || !dest || pickup.length < 3 || dest.length < 3) {
    priceEl.innerText = 'Rp 0';
    detailEl.innerText = 'Isi alamat dengan lengkap';
    return;
  }

  priceEl.innerText = 'Menghitung...';
  detailEl.innerText = 'Mohon tunggu...';

  try {
    const route = await getDistance(pickup, dest);
    const cost = calculateCost({ serviceType:type, distanceKm:route.distance_km });
    priceEl.innerText = 'Rp ' + cost.total_price.toLocaleString('id-ID');
    detailEl.innerHTML = `Jarak: ${route.distance_km} km (±${route.duration_min} menit)<br>Jasa: Rp ${cost.service_cost.toLocaleString('id-ID')}<br>Biaya layanan: Rp ${cost.service_fee.toLocaleString('id-ID')}`;
  } catch (err) {
    priceEl.innerText = 'Rp 0';
    detailEl.innerHTML = '⚠️ ' + escapeHtml(err.message);
  }
}

function setKulinerCat(cat) {
  APP.filters.kulinerCat = cat;
  document.querySelectorAll('[data-kcat]').forEach(el => 
    el.classList.toggle('active', el.dataset.kcat === cat));
  filterKulinerList();
}

function filterKulinerList() {
  renderKulinerList();
}

function renderKulinerList() {
  const c = document.getElementById('kulinerResultList');
  if (!c) return;

  const search = (APP.filters.kulinerSearch || '').trim();
  const cat = APP.filters.kulinerCat || 'ALL';

  const allMenus = [];
  partnersCache.forEach(p => {
    (menusCache[p.id] || []).forEach(m => {
      allMenus.push({ ...m, partner: p });
    });
  });

  let filtered = allMenus;
  if (cat !== 'ALL') filtered = filtered.filter(m => m.category === cat);
  if (search) {
    filtered = filtered.filter(m => 
      m.name.toLowerCase().includes(search) ||
      (m.partner.business_name || '').toLowerCase().includes(search) ||
      (m.description || '').toLowerCase().includes(search)
    );
  }

  if (!filtered.length) {
    c.innerHTML = `<div class="empty"><span class="icon">🔍</span>Tidak ada menu yang cocok</div>`;
    return;
  }

  const byPartner = {};
  filtered.forEach(m => {
    if (!byPartner[m.partner.id]) byPartner[m.partner.id] = { partner: m.partner, items: [] };
    byPartner[m.partner.id].items.push(m);
  });

  let html = '';
  Object.values(byPartner).forEach(({ partner, items }) => {
    const isOpen = partner.status === 'OPEN';
    html += `
      <div style="background:#F8FAFC;border-radius:12px;padding:12px;margin-bottom:12px;border:1.5px solid var(--border);">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <div style="display:flex;gap:8px;align-items:center;">
            <div style="width:32px;height:32px;border-radius:50%;background:var(--primary);color:white;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;">
              ${(partner.business_name||'M').charAt(0).toUpperCase()}
            </div>
            <div>
              <div style="font-weight:700;font-size:13px;">${escapeHtml(partner.business_name)}</div>
              <div style="font-size:10.5px;color:var(--muted);">📍 ${escapeHtml(partner.address || '-')}</div>
            </div>
          </div>
          <span class="badge" style="background:${isOpen ? 'var(--green)' : '#94A3B8'};font-size:9px;">
            ${isOpen ? '🟢 BUKA' : '🔴 TUTUP'}
          </span>
        </div>
        ${items.map(m => {
          const qty = selectedMenuItems[m.id]?.qty || 0;
          const img = m.image_url ? `<img src="${m.image_url}" alt="" onerror="this.parentElement.innerHTML='🍽️'">` : '🍽️';
          return `
            <div class="driver-item" style="${qty>0?'border-color:var(--primary);background:#EFF6FF;':''}margin-bottom:6px;">
              <div class="avatar" style="background:#F1F5F9;color:inherit;overflow:hidden;">${img}</div>
              <div class="info">
                <div class="name">${escapeHtml(m.name)}</div>
                <div class="meta">${m.category || '-'} · Rp ${Number(m.price).toLocaleString('id-ID')}</div>
              </div>
              <div style="display:flex;gap:6px;align-items:center;">
                ${qty>0?`<button class="icon-btn" onclick="changeQty('${m.id}',-1)">−</button><span style="font-weight:700;min-width:20px;text-align:center;">${qty}</span>`:''}
                <button class="icon-btn" style="background:var(--primary);color:white;" onclick="changeQty('${m.id}',1)">+</button>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  });

  c.innerHTML = html;
}

function changeQty(menuId, delta) {
  let menu = null, partnerId = null;
  for (const pid in menusCache) {
    const found = (menusCache[pid] || []).find(m => m.id === menuId);
    if (found) { menu = found; partnerId = pid; break; }
  }
  if (!menu) return;

  if (selectedPartner && selectedPartner.id !== partnerId) {
    selectedMenuItems = {};
  }
  selectedPartner = partnersCache.find(p => p.id === partnerId);

  if (!selectedMenuItems[menuId]) selectedMenuItems[menuId] = { menu, qty: 0 };
  selectedMenuItems[menuId].qty += delta;
  if (selectedMenuItems[menuId].qty <= 0) delete selectedMenuItems[menuId];

  const kf = document.getElementById('kulinerFields');
  if (kf) kf.style.display = Object.keys(selectedMenuItems).length > 0 ? 'block' : 'none';
  
  if (Object.keys(selectedMenuItems).length > 0) {
    setTimeout(() => {
      setupAutocomplete('fldDest', () => {});
      const btn = document.getElementById('btnSubmitOrder');
      if (btn) btn.onclick = () => submitOrder('kuliner');
    }, 100);
  }

  renderKulinerList();
  updateKulinerTotal();
}

function updateKulinerTotal() {
  const items = Object.values(selectedMenuItems);
  const subtotal = items.reduce((s,i) => s + i.menu.price * i.qty, 0);
  const rule = getRule('kuliner');
  const markup = Math.round(subtotal * (rule.umkm_markup_pct / 100));
  const total = subtotal + markup;
  const priceEl = document.getElementById('estPrice');
  const detailEl = document.getElementById('estDetail');
  if (priceEl) priceEl.innerText = 'Rp ' + total.toLocaleString('id-ID');
  if (detailEl) {
    if (!items.length) detailEl.innerText = 'Belum ada item dipilih';
    else {
      const count = items.reduce((s,i) => s + i.qty, 0);
      detailEl.innerHTML = `${count} item · Mitra: ${escapeHtml(selectedPartner?.business_name || '-')}<br>Subtotal: Rp ${subtotal.toLocaleString('id-ID')}<br>(termasuk markup Rp ${markup.toLocaleString('id-ID')})<br><em style="font-size:10px;">Ongkir dihitung saat pesan</em>`;
    }
  }
}

async function submitOrder(type) {
  const g = getGuestData();
  if (!g || !g.id) { showToast('Isi data dulu', 'error'); return; }

  const isUUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(g.id);

  if (!isUUID) {
    showToast('🔄 Menyiapkan akun...', 'success');
    try {
      const { data: existing } = await APP.supabase
        .from('profiles').select('id').eq('phone', g.phone).maybeSingle();

      let realId;
      if (existing) {
        realId = existing.id;
      } else {
        const { data: newProfile, error } = await APP.supabase
          .from('profiles')
          .insert({
            id: crypto.randomUUID(),
            name: g.name, phone: g.phone,
            email: `guest_${Date.now()}_${Math.random().toString(36).slice(2,8)}@andalan.local`,
            role: 'customer', status: 'active'
          })
          .select().single();
        if (error) throw new Error('Gagal buat profile: ' + error.message);
        realId = newProfile.id;
      }
      saveGuestData({ ...g, id: realId });
      g.id = realId;
    } catch (err) {
      showToast('Gagal siapkan akun: ' + err.message, 'error');
      return;
    }
  }

  const btn = document.getElementById('btnSubmitOrder');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner-sm"></span>Memproses...'; }

  try {
    let pickup = '', dest = '', subtotal = 0, partnerId = null, items = [], note = '';

    if (type === 'kurir') {
      pickup = document.getElementById('fldPickup').value.trim();
      dest = document.getElementById('fldDest').value.trim();
      const itemType = document.getElementById('fldItemType').value;
      note = `[${itemType}] ${document.getElementById('fldNote').value.trim()}`.trim();
      if (!pickup || !dest) throw new Error('Alamat pickup & tujuan wajib diisi');
    } else if (type === 'ojek') {
      pickup = document.getElementById('fldPickup').value.trim();
      dest = document.getElementById('fldDest').value.trim();
      const vehicle = document.getElementById('fldVehicle').value;
      note = `[${vehicle}] ${document.getElementById('fldNote').value.trim()}`.trim();
      if (!pickup || !dest) throw new Error('Lokasi jemput & tujuan wajib diisi');
    } else if (type === 'jastip') {
      pickup = document.getElementById('fldStore').value.trim();
      dest = document.getElementById('fldDest').value.trim();
      const item = document.getElementById('fldItem').value.trim();
      const qty = document.getElementById('fldQty').value;
      const budget = document.getElementById('fldBudget').value;
      if (!pickup || !dest || !item || !budget) throw new Error('Semua field wajib diisi');
      note = `Beli: ${item} x${qty} | Budget: Rp ${budget} | ${document.getElementById('fldNote').value.trim()}`.trim();
    } else if (type === 'kuliner') {
      if (!selectedPartner) throw new Error('Pilih mitra dulu');
      items = Object.values(selectedMenuItems);
      if (!items.length) throw new Error('Pilih minimal 1 menu');
      dest = document.getElementById('fldDest').value.trim();
      if (!dest) throw new Error('Alamat pengantaran wajib diisi');
      pickup = selectedPartner.address || selectedPartner.business_name;
      partnerId = selectedPartner.id;
      subtotal = items.reduce((s,i) => s + i.menu.price * i.qty, 0);
      note = document.getElementById('fldNote').value.trim();
    }

    if (btn) btn.innerHTML = '<span class="spinner-sm"></span>Menghitung jarak...';
    const route = await getDistance(pickup, dest);
    const cost = calculateCost({ serviceType:type, distanceKm:route.distance_km, subtotal });

    if (btn) btn.innerHTML = '<span class="spinner-sm"></span>Menyimpan...';

    const orderData = {
      customer_id: g.id,
      service_type: type,
      status: 'MENUNGGU',
      pickup_address: pickup,
      destination_address: dest,
      distance_km: cost.distance_km,
      subtotal: cost.subtotal,
      service_fee: cost.service_fee,
      delivery_fee: cost.service_cost,
      umkm_markup: cost.umkm_markup,
      total_price: cost.total_price,
      driver_earnings: cost.driver_earnings,
      mitra_earnings: cost.mitra_earnings,
      platform_earnings: cost.platform_earnings,
      partner_id: partnerId,
      customer_note: note
    };

    const { data: newOrder, error } = await APP.supabase.from('orders').insert([orderData]).select().single();
    if (error) throw new Error('Gagal simpan: ' + error.message);

    if (type === 'kuliner' && newOrder) {
      const orderItems = items.map(i => ({
        order_id: newOrder.id, menu_id: i.menu.id,
        item_name: i.menu.name, quantity: i.qty,
        price: i.menu.price, subtotal: i.menu.price * i.qty
      }));
      await APP.supabase.from('order_items').insert(orderItems);
    }

    await APP.supabase.from('order_status_history').insert({
      order_id: newOrder.id, status:'MENUNGGU',
      note: `Order dibuat. Jarak: ${cost.distance_km} km`
    });

    showToast('✅ Pesanan berhasil!', 'success');
    selectedMenuItems = {}; selectedPartner = null;
    closeGlobalModal();
    await loadFeaturedMenus();
    switchCustTab('orders');
  } catch (err) {
    console.error('Submit error:', err);
    showToast('Gagal: ' + err.message, 'error');
    if (btn) { btn.disabled = false; btn.innerText = 'Pesan Sekarang'; }
  }
}

async function loadDriverProfile() {
  const { data: driver } = await APP.supabase.from('drivers').select('*').eq('profile_id', APP.user.id).maybeSingle();
  if (!driver) { showToast('Data driver belum dibuat. Hubungi admin.', 'error'); return; }
  APP.data.driver = driver;
  updateDrvStatusUI(driver.online_status);
}

function updateDrvStatusUI(status) {
  const dot = document.getElementById('drvStatusDot');
  const txt = document.getElementById('drvStatusText');
  const badge = document.getElementById('drvProfileBadge');
  if (!dot) return;
  dot.classList.remove('online','busy');
  if (status === 'ONLINE') { dot.classList.add('online'); txt.innerText = 'ONLINE'; if (badge) { badge.style.background = 'var(--green)'; badge.innerText = 'ONLINE'; } }
  else if (status === 'BUSY') { dot.classList.add('busy'); txt.innerText = 'BUSY'; if (badge) { badge.style.background = 'var(--orange)'; badge.innerText = 'BUSY'; } }
  else { txt.innerText = 'OFFLINE'; if (badge) { badge.style.background = '#94A3B8'; badge.innerText = 'OFFLINE'; } }
}

async function loadDriverHome() {
  const driver = APP.data.driver;
  if (!driver) return;

  const today = new Date(); today.setHours(0,0,0,0);
  const { data: todayOrders } = await APP.supabase.from('orders').select('*')
    .eq('driver_id', driver.id).gte('created_at', today.toISOString());
  const list = todayOrders || [];
  document.getElementById('drvStatToday').innerText = list.length;
  document.getElementById('drvStatDone').innerText = list.filter(o => o.status === 'SELESAI').length;
  document.getElementById('drvStatRating').innerText = Number(driver.rating || 5).toFixed(1);

  const { data: active } = await APP.supabase.from('orders').select('*')
    .eq('driver_id', driver.id)
    .in('status', ['DITUGASKAN','DITERIMA DRIVER','MENUJU PICKUP','SAMPAI PICKUP','DIAMBIL','MENUJU TUJUAN'])
    .order('created_at');
  await enrichDriverOrders(active || []);

  const c = document.getElementById('drvActiveOrders');
  const cnt = document.getElementById('drvActiveCount');
  if (!active || active.length === 0) {
    c.innerHTML = `<div class="empty"><span class="icon">🛵</span>Belum ada order aktif.<br>${driver.online_status === 'ONLINE' ? 'Menunggu order dari admin...' : 'Aktifkan ONLINE untuk menerima order.'}</div>`;
    if (cnt) cnt.style.display = 'none';
  } else {
    if (cnt) { cnt.innerText = active.length; cnt.style.display = 'inline-block'; }
    c.innerHTML = active.map(o => renderDriverOrderCard(o)).join('');
  }

  const { data: next } = await APP.supabase.from('orders').select('*')
    .is('driver_id', null).eq('status','MENUNGGU').order('created_at').limit(5);
  await enrichDriverOrders(next || []);
  const nc = document.getElementById('drvNextOrders');
  if (!next || next.length === 0) {
    nc.innerHTML = '<div class="empty"><span class="icon">📭</span>Belum ada order</div>';
  } else {
    nc.innerHTML = next.map(o => `
      <div class="card" style="border-left:4px solid var(--orange);">
        <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
          <strong>${o.order_code}</strong>
          <span class="badge" style="background:var(--orange);">MENUNGGU</span>
        </div>
        <div style="font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:8px;">
          ${getServiceIcon(o.service_type)} ${o.service_type?.toUpperCase()}
        </div>
        <div style="font-size:12px;line-height:1.6;">
          📍 ${escapeHtml(o.pickup_address || '-')}<br>
          🎯 ${escapeHtml(o.destination_address || '-')}
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:10px;">
          <span class="price">Rp ${Number(o.total_price).toLocaleString('id-ID')}</span>
          <span style="font-size:11px;color:var(--muted);">${formatTime(o.created_at)}</span>
        </div>
      </div>
    `).join('');
  }
}

async function enrichDriverOrders(orders) {
  if (!orders.length) return;
  const custIds = [...new Set(orders.map(o => o.customer_id).filter(Boolean))];
  if (!custIds.length) return;
  const { data: profs } = await APP.supabase.from('profiles').select('id, name, phone').in('id', custIds);
  const map = {};
  (profs||[]).forEach(p => map[p.id] = p);
  orders.forEach(o => o.customer = map[o.customer_id] || null);
}

async function drvToggleOnline() {
  const driver = APP.data.driver;
  if (!driver) return;
  if (driver.online_status === 'BUSY') { showToast('Anda sedang dalam order aktif', 'error'); return; }
  const newStatus = driver.online_status === 'ONLINE' ? 'OFFLINE' : 'ONLINE';
  const ok = await showConfirm({
    icon: newStatus==='ONLINE'?'🟢':'🔴',
    title: newStatus==='ONLINE'?'Aktifkan Online?':'Matikan Online?',
    message: newStatus==='ONLINE'?'Anda akan mulai menerima order.':'Tidak akan menerima order sementara.',
    confirmText:'Ya', confirmColor: newStatus==='ONLINE'?'green':'red'
  });
  if (!ok) return;
  await APP.supabase.from('drivers').update({ online_status: newStatus }).eq('id', driver.id);
  driver.online_status = newStatus;
  updateDrvStatusUI(newStatus);
  showToast(newStatus==='ONLINE'?'✅ Online':'⏸️ Offline', 'success');
  loadDriverHome();
}

async function drvUpdateStatus(orderId, newStatus) {
  const messages = {
    'DITERIMA DRIVER':'Terima order ini?',
    'MENUJU PICKUP':'Konfirmasi sedang menuju pickup?',
    'SAMPAI PICKUP':'Konfirmasi sudah sampai pickup?',
    'DIAMBIL':'Barang/penumpang sudah diambil?',
    'MENUJU TUJUAN':'Konfirmasi sedang menuju tujuan?',
    'SELESAI':'Selesaikan order ini?'
  };
  const ok = await showConfirm({
    icon:'❓', title:'Konfirmasi', message: messages[newStatus] || 'Lanjutkan?',
    confirmText:'Ya', confirmColor: newStatus==='SELESAI'?'green':'primary'
  });
  if (!ok) return;
  try {
    const { error } = await APP.supabase.from('orders')
      .update({ status:newStatus, updated_at:new Date().toISOString() }).eq('id', orderId);
    if (error) throw error;
    await APP.supabase.from('order_status_history').insert({
      order_id: orderId, status:newStatus, changed_by:APP.user.id, note:`Driver update: ${newStatus}`
    });

    const driver = APP.data.driver;
    if (newStatus === 'SELESAI') {
      await APP.supabase.from('drivers').update({ online_status:'ONLINE', total_orders:(driver.total_orders||0)+1 }).eq('id', driver.id);
      driver.online_status = 'ONLINE'; driver.total_orders = (driver.total_orders||0)+1;
      updateDrvStatusUI('ONLINE');
    } else if (['DITERIMA DRIVER','MENUJU PICKUP','SAMPAI PICKUP','DIAMBIL','MENUJU TUJUAN'].includes(newStatus)) {
      await APP.supabase.from('drivers').update({ online_status:'BUSY' }).eq('id', driver.id);
      driver.online_status = 'BUSY';
      updateDrvStatusUI('BUSY');
    }

    showToast('✅ Status: ' + newStatus, 'success');
    await loadDriverHome();
    await loadDriverWallet();
  } catch (err) { showToast('Gagal: ' + err.message, 'error'); }
}

function drvOpenNavigation(orderId) {
  APP.supabase.from('orders').select('*').eq('id', orderId).single().then(({ data: order }) => {
    if (!order) return;
    const goToPickup = ['DITUGASKAN','DITERIMA DRIVER','MENUJU PICKUP'].includes(order.status);
    const addr = goToPickup ? order.pickup_address : order.destination_address;
    const lat = goToPickup ? order.pickup_lat : order.destination_lat;
    const lng = goToPickup ? order.pickup_lng : order.destination_lng;
    const label = goToPickup ? 'Pickup' : 'Tujuan';

    openGlobalModal(`
      <h3>🗺️ Navigasi ke ${label}</h3>
      <div style="background:#F8FAFC;padding:12px;border-radius:12px;margin-bottom:14px;font-size:13px;">
        🎯 ${escapeHtml(addr || '-')}
      </div>
      <button class="btn btn-primary" style="margin-bottom:8px;" onclick="launchNavigation('${lat || ''}','${lng || ''}','${encodeURIComponent(addr || '')}', 'google')">🗺️ Google Maps</button>
      <button class="btn btn-primary" style="margin-bottom:8px;background:#1565C0;" onclick="launchNavigation('${lat || ''}','${lng || ''}','${encodeURIComponent(addr || '')}', 'waze')">🚗 Waze</button>
      <button class="btn btn-ghost" onclick="copyAddr('${encodeURIComponent(addr || '')}')">📋 Copy Alamat</button>
      <button class="btn btn-ghost" style="margin-top:8px;" onclick="closeGlobalModal()">Tutup</button>
    `);
  });
}

function launchNavigation(lat, lng, addrEnc, app) {
  const addr = decodeURIComponent(addrEnc || '');
  let url = '';
  if (lat && lng) {
    if (app === 'google') url = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving&dir_action=navigate`;
    else if (app === 'waze') url = `https://waze.com/ul?ll=${lat},${lng}&navigate=yes&zoom=17`;
  } else if (addr) {
    if (app === 'google') url = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(addr)}&travelmode=driving`;
    else if (app === 'waze') url = `https://waze.com/ul?q=${encodeURIComponent(addr)}&navigate=yes`;
  }
  if (url) window.open(url, '_blank');
  else showToast('Alamat tidak tersedia', 'error');
}

function copyAddr(addrEnc) {
  const addr = decodeURIComponent(addrEnc || '');
  if (navigator.clipboard) {
    navigator.clipboard.writeText(addr).then(() => showToast('✅ Alamat disalin', 'success'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = addr; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    showToast('✅ Alamat disalin', 'success');
  }
  closeGlobalModal();
}

function drvRefreshLocation() {
  if (!navigator.geolocation) { showToast('GPS tidak didukung', 'error'); return; }
  showToast('Mengambil lokasi...');
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      const { latitude, longitude } = pos.coords;
      const driver = APP.data.driver;
      if (driver) {
        await APP.supabase.from('drivers').update({ current_lat: latitude, current_lng: longitude }).eq('id', driver.id);
      }
      showToast('✅ Lokasi diperbarui', 'success');
    },
    (err) => showToast('Gagal: ' + err.message, 'error'),
    { enableHighAccuracy:true }
  );
}

function startDriverLocationTracking() {
  if (!navigator.geolocation) return;
  let lastUpdate = 0;
  const MIN_INTERVAL = 30000;
  window.__drvWatchId = navigator.geolocation.watchPosition(
    async (pos) => {
      if (Date.now() - lastUpdate < MIN_INTERVAL) return;
      lastUpdate = Date.now();
      const { latitude, longitude } = pos.coords;
      const driver = APP.data.driver;
      if (driver) await APP.supabase.from('drivers').update({ current_lat:latitude, current_lng:longitude }).eq('id', driver.id);
    },
    () => {},
    { enableHighAccuracy:false, maximumAge:60000, timeout:15000 }
  );
}

async function drvLogout() {
  const ok = await showConfirm({ icon:'🚪', title:'Keluar?', message:'Anda akan keluar.', confirmText:'Ya', confirmColor:'red' });
  if (!ok) return;
  const driver = APP.data.driver;
  if (driver && driver.online_status !== 'BUSY') {
    await APP.supabase.from('drivers').update({ online_status:'OFFLINE' }).eq('id', driver.id);
  }
  if (window.__drvWatchId) navigator.geolocation.clearWatch(window.__drvWatchId);
  await APP.supabase.auth.signOut();
  window.location.reload();
}

async function loadMitraProfile() {
  const { data: partner } = await APP.supabase
    .from('partners').select('*').eq('profile_id', APP.user.id).maybeSingle();
  if (!partner) { showToast('Data mitra belum dibuat', 'error'); return; }
  APP.data.partner = partner;
  
  const nameEl = document.getElementById('mitraStoreName');
  const hoursEl = document.getElementById('mitraStoreHours');
  const pNameEl = document.getElementById('mitraProfileName');
  const pAddrEl = document.getElementById('mitraProfileAddr');
  
  if (nameEl) nameEl.innerText = partner.business_name || 'Mitra';
  if (hoursEl) hoursEl.innerText = (partner.opening_time && partner.closing_time)
    ? `${partner.opening_time.slice(0,5)} - ${partner.closing_time.slice(0,5)}` : '--:-- - --:--';
  if (pNameEl) pNameEl.innerText = partner.business_name || 'Mitra';
  if (pAddrEl) pAddrEl.innerText = '📍 ' + (partner.address || '-');
  updateMitraStatusUI(partner.status);
}

function updateMitraStatusUI(status) {
  const dot = document.getElementById('mitraStoreDot');
  const txt = document.getElementById('mitraStoreStatus');
  const badge = document.getElementById('mitraProfileBadge');
  if (!dot) return;
  if (status === 'OPEN') {
    dot.classList.add('online');
    txt.innerText = 'BUKA';
    if (badge) { badge.style.background = 'var(--green)'; badge.innerText = 'BUKA'; }
  } else {
    dot.classList.remove('online');
    txt.innerText = 'TUTUP';
    if (badge) { badge.style.background = '#94A3B8'; badge.innerText = 'TUTUP'; }
  }
}

    .eq('partner_id', partner.id).gte('created_at', today.toISOString());

  const readyEl = document.getElementById('mitraStatReady');
  
  if (doneEl) doneEl.innerText = done.length;
  if (procEl) procEl.innerText = proc.length;
  if (readyEl) readyEl.innerText = ready.length;

function handleMenuImageSelect(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) { showToast('Foto max 2MB', 'error'); return; }
  if (!file.type.startsWith('image/')) { showToast('File harus gambar', 'error'); return; }
  window.__selectedMenuFile = file;
  const reader = new FileReader();
  reader.onload = (e) => {
    const area = document.getElementById('menuUploadArea');
    if (area) area.innerHTML = `<div style="width:100%;height:140px;border-radius:10px;overflow:hidden;"><img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover;"></div>`;
  };
  reader.readAsDataURL(file);
}

async function saveMitraMenu() {
  const partner = APP.data.partner;
  const btn = document.getElementById('btnSaveMenu');
  btn.disabled = true; btn.innerHTML = '<span class="spinner-sm"></span>Menyimpan...';
  try {
    const category = document.getElementById('menuFormCategory').value;
    const name = document.getElementById('menuFormName').value.trim();
    const description = document.getElementById('menuFormDesc').value.trim();
    const price = parseInt(document.getElementById('menuFormPrice').value) || 0;
    if (!name) throw new Error('Nama menu wajib');
    if (price <= 0) throw new Error('Harga wajib');

    let imageUrl = window.__menuEditId 
      ? (APP.data.menus.find(m => m.id === window.__menuEditId)?.image_url || null) 
      : null;

    if (window.__selectedMenuFile) {
      btn.innerHTML = '<span class="spinner-sm"></span>Upload foto...';
      const ext = window.__selectedMenuFile.name.split('.').pop();
      const fileName = `menu_${partner.id}_${Date.now()}.${ext}`;
      const { data: up, error: upErr } = await APP.supabase.storage
        .from('menu-images').upload(fileName, window.__selectedMenuFile);
      if (upErr) throw new Error('Upload gagal: ' + upErr.message);
      const { data: urlData } = APP.supabase.storage.from('menu-images').getPublicUrl(up.path);
      imageUrl = urlData.publicUrl;
    }

    const data = { 
      partner_id: partner.id, category, name, description, price, 
      image_url: imageUrl, is_available: true, 
      updated_at: new Date().toISOString() 
    };

    if (window.__menuEditId) {
      const { error } = await APP.supabase.from('menus').update(data).eq('id', window.__menuEditId);
      if (error) throw error;
      showToast('✅ Menu diperbarui', 'success');
    } else {
      const { error } = await APP.supabase.from('menus').insert([data]);
      if (error) throw error;
      showToast('✅ Menu ditambahkan', 'success');
    }
    closeGlobalModal();
    await loadMitraMenus();
  } catch (err) {
    showToast('Gagal: ' + err.message, 'error');
    btn.disabled = false; btn.innerText = '💾 Simpan';
  }
}

  const partner = APP.data.partner;

    .order('created_at', { ascending:false }).limit(100);
  APP.data.orders = data || [];

  renderMitraOrders();

  if (sub) sub.innerText = (data || []).length + ' pesanan';

function updateMitraOrderCounts() {
  const list = APP.data.orders || [];
  const counts = { ALL:list.length, NEW:0, PROCESSING:0, READY:0, DONE:0, CANCELED:0 };
  list.forEach(o => {
    if (o.status === 'MENUNGGU') counts.NEW++;
    if (o.status === 'DIPROSES') counts.PROCESSING++;
    if (o.status === 'SIAP DIAMBIL') counts.READY++;
    if (o.status === 'SELESAI') counts.DONE++;
    if (o.status === 'DIBATALKAN') counts.CANCELED++;
  });
  const setTxt = (id, val) => {
    const el = document.getElementById(id);
    if (el) el.innerText = val;
  };
  setTxt('moc-all', counts.ALL);
  setTxt('moc-new', counts.NEW);
  setTxt('moc-proc', counts.PROCESSING);
  setTxt('moc-ready', counts.READY);
  setTxt('moc-done', counts.DONE);
  setTxt('moc-cancel', counts.CANCELED);
}

function setMitraOrderFilter(f) {
  APP.filters.order = f;
  document.querySelectorAll('#app [data-of]').forEach(el => 
    el.classList.toggle('active', el.dataset.of === f));
  renderMitraOrders();
}

function renderMitraOrders() {
  const c = document.getElementById('mitraOrderList');
  if (!c) return;
  const list = APP.data.orders || [];
  let filtered = list;
  const f = APP.filters.order;
  if (f === 'NEW') filtered = list.filter(o => o.status === 'MENUNGGU');
  else if (f === 'PROCESSING') filtered = list.filter(o => o.status === 'DIPROSES');
  else if (f === 'READY') filtered = list.filter(o => o.status === 'SIAP DIAMBIL');
  else if (f === 'DONE') filtered = list.filter(o => o.status === 'SELESAI');
  else if (f === 'CANCELED') filtered = list.filter(o => o.status === 'DIBATALKAN');
  if (!filtered.length) { 
    c.innerHTML = '<div class="empty"><span class="icon">📭</span>Belum ada pesanan</div>'; 
    return; 
  }
  c.innerHTML = filtered.map(o => renderMitraOrderCard(o)).join('');
}

function renderMitraOrderCard(o, showActions = false) {
  const statusMap = {
    'MENUNGGU':'Baru', 'DIPROSES':'Diproses', 'SIAP DIAMBIL':'Siap Diambil',
    'SELESAI':'Selesai', 'DIBATALKAN':'Ditolak'
  };
  let actionHtml = '';
  if (o.status === 'MENUNGGU') {
    actionHtml = `
      <div class="btn-row">
        <button class="btn btn-red btn-sm" onclick="event.stopPropagation();mitraRejectOrder('${o.id}')">❌ Tolak</button>
        <button class="btn btn-green btn-sm" onclick="event.stopPropagation();mitraAcceptOrder('${o.id}')">✅ Terima</button>
      </div>
    `;
  } else if (o.status === 'DIPROSES') {
    actionHtml = `<button class="btn btn-orange btn-sm" style="margin-top:10px;" onclick="event.stopPropagation();mitraMarkReady('${o.id}')">📦 Tandai Siap Diambil</button>`;
  }
  
  const rejectInfo = (o.status === 'DIBATALKAN' && o.cancel_reason) ? `
    <div style="background:#FEF2F2;border:1px solid #FECACA;color:#991B1B;padding:8px 10px;border-radius:8px;font-size:11.5px;margin-top:8px;line-height:1.5;">
      <strong>❌ Alasan tolak:</strong> ${escapeHtml(o.cancel_reason)}
    </div>
  ` : '';
  
  return `
    <div class="card" style="border-left:4px solid ${getStatusColor(o.status)};">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;gap:8px;">
        <strong>${o.order_code}</strong>
        <span class="badge" style="background:${getStatusColor(o.status)};">${statusMap[o.status] || o.status}</span>
      </div>
      <div style="font-size:12px;color:var(--muted);line-height:1.6;">
        🕐 ${formatTime(o.created_at)}<br>
        🎯 ${escapeHtml(o.destination_address || '-')}
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:8px;align-items:center;">
        <span class="price">Rp ${Number(o.mitra_earnings || 0).toLocaleString('id-ID')}</span>
      </div>
      ${rejectInfo}
      ${actionHtml}
    </div>
  `;
}

async function mitraRejectOrder(orderId) {
  return new Promise((resolve) => {
    const modal = document.getElementById('globalModalContent');
    modal.innerHTML = `
      <h3>❌ Tolak Pesanan?</h3>
      <p style="font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.5;">
        Pesanan akan dibatalkan dan customer akan mendapat notifikasi. Berikan alasan yang jelas.
      </p>
      <div class="field">
        <label>Alasan Penolakan <span class="req">*</span></label>
        <select id="rejectReason" onchange="document.getElementById('rejectOther').style.display = this.value === 'Lainnya' ? 'block' : 'none'">
          <option value="">— Pilih alasan —</option>
          <option value="Stok habis">🚫 Stok habis</option>
          <option value="Menu tidak tersedia">📋 Menu tidak tersedia</option>
          <option value="Toko sedang tutup">🔒 Toko sedang tutup</option>
          <option value="Bahan baku habis">🧺 Bahan baku habis</option>
          <option value="Antrian terlalu banyak">⏳ Antrian terlalu banyak</option>
          <option value="Lainnya">✏️ Lainnya...</option>
        </select>
        <textarea id="rejectOther" placeholder="Tulis alasan lain..." 
          style="display:none;margin-top:8px;"></textarea>
      </div>
      <div class="btn-row">
        <button class="btn btn-ghost" onclick="window.__rejectResolve(false)">Batal</button>
        <button class="btn btn-red" onclick="window.__rejectResolve(true)">❌ Tolak Pesanan</button>
      </div>
    `;
    document.getElementById('globalModal').classList.add('active');
    
    window.__rejectResolve = async (confirmed) => {
      if (!confirmed) { closeGlobalModal(); resolve(); return; }
      
      let reason = document.getElementById('rejectReason').value;
      if (reason === 'Lainnya') reason = document.getElementById('rejectOther').value.trim();
      if (!reason) { showToast('Pilih alasan penolakan', 'error'); return; }
      
      const order = (APP.data.orders || []).find(o => o.id === orderId);
      
      try {
        const updateData = { 
          status: 'DIBATALKAN',
          updated_at: new Date().toISOString()
        };
        try {
          await APP.supabase.from('orders').update({ 
            ...updateData, 
            cancel_reason: reason, 
            cancelled_by: 'mitra' 
          }).eq('id', orderId);
        } catch (colErr) {
          await APP.supabase.from('orders').update(updateData).eq('id', orderId);
        }
        
        await APP.supabase.from('order_status_history').insert({
          order_id: orderId,
          status: 'DIBATALKAN',
          changed_by: APP.user.id,
          note: `Ditolak mitra: ${reason}`
        });
        
        if (order?.driver_id) {
          await APP.supabase.from('drivers')
            .update({ online_status: 'ONLINE' })
            .eq('id', order.driver_id);
        }
        
        showToast('✅ Pesanan ditolak: ' + reason, 'success');
        closeGlobalModal();
        await loadMitraOrders();
        await loadMitraHome();
        resolve();
      } catch (err) {
        showToast('Gagal: ' + err.message, 'error');
      }
    };
  });
}

async function admEnrich(orders) {
  if (!orders.length) return;
  const custIds = [...new Set(orders.map(o => o.customer_id).filter(Boolean))];
  const driverIds = [...new Set(orders.map(o => o.driver_id).filter(Boolean))];
  const partnerIds = [...new Set(orders.map(o => o.partner_id).filter(Boolean))];

  let custMap = {}, driverMap = {}, partnerMap = {};
  if (custIds.length) {
    const { data } = await APP.supabase.from('profiles').select('id, name, phone').in('id', custIds);
    (data||[]).forEach(p => custMap[p.id] = p);
  }
  if (driverIds.length) {
    const { data: drivers } = await APP.supabase.from('drivers').select('id, vehicle_type, vehicle_number, rating, profile_id').in('id', driverIds);
    if (drivers?.length) {
      const pids = drivers.map(d => d.profile_id);
      const { data: profs } = await APP.supabase.from('profiles').select('id, name, phone').in('id', pids);
      const pMap = {};
      (profs||[]).forEach(p => pMap[p.id] = p);
      drivers.forEach(d => driverMap[d.id] = { ...d, profile: pMap[d.profile_id] });
    }
  }
  if (partnerIds.length) {
    const { data } = await APP.supabase.from('partners').select('id, business_name, phone, address').in('id', partnerIds);
    (data||[]).forEach(p => partnerMap[p.id] = p);
  }
  orders.forEach(o => {
    o.customer = custMap[o.customer_id] || null;
    o.driver = driverMap[o.driver_id] || null;
    o.partner = partnerMap[o.partner_id] || null;
  });
}

function updateAdmFilterCounts() {
  const list = APP.data.allOrders || [];
  const counts = { ALL:list.length, MENUNGGU:0, DIPROSES:0, AKTIF:0, SELESAI:0, DIBATALKAN:0 };
  const active = ['DITUGASKAN','DITERIMA DRIVER','MENUJU PICKUP','SAMPAI PICKUP','DIAMBIL','MENUJU TUJUAN'];
  list.forEach(o => {
    if (o.status === 'MENUNGGU') counts.MENUNGGU++;
    else if (o.status === 'DIPROSES') counts.DIPROSES++;
    else if (active.includes(o.status)) counts.AKTIF++;
    else if (o.status === 'SELESAI') counts.SELESAI++;
    else if (o.status === 'DIBATALKAN') counts.DIBATALKAN++;
  });
  document.getElementById('afc-all').innerText = counts.ALL;
  document.getElementById('afc-wait').innerText = counts.MENUNGGU;
  document.getElementById('afc-proc').innerText = counts.DIPROSES;
  document.getElementById('afc-active').innerText = counts.AKTIF;
  document.getElementById('afc-done').innerText = counts.SELESAI;
  document.getElementById('afc-cancel').innerText = counts.DIBATALKAN;
}
